<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实验5 拓展 - 待办事项 TodoList</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 40px 16px; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      background: linear-gradient(135deg, #e8f5ef, #e6eefb); color: #2c3e50;
    }
    .todo-app {
      max-width: 560px; margin: 0 auto; background: #fff; border-radius: 16px;
      box-shadow: 0 12px 36px rgba(31, 45, 61, .12); overflow: hidden;
    }
    .todo-app h2 { margin: 0; padding: 22px 26px 4px; font-size: 21px; }
    .todo-app .sub { margin: 0; padding: 0 26px 14px; color: #8a94a6; font-size: 13px; }
    .todo-form { display: flex; gap: 8px; padding: 0 26px 14px; }
    .todo-form input {
      flex: 1; font: inherit; font-size: 15px; padding: 10px 14px;
      border: 1px solid #d8dee9; border-radius: 10px; outline: none;
    }
    .todo-form input:focus { border-color: #42b883; box-shadow: 0 0 0 3px rgba(66, 184, 131, .15); }
    .todo-form button {
      font: inherit; padding: 0 20px; border: none; border-radius: 10px;
      background: #42b883; color: #fff; cursor: pointer;
    }
    .todos { list-style: none; margin: 0; padding: 0 12px; }
    .todos li {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px;
      border-bottom: 1px solid #f1f3f7; border-radius: 8px;
    }
    .todos li:hover { background: #fafbfd; }
    .todos li.done .text { color: #a6aebb; text-decoration: line-through; }
    .todos .text { flex: 1; word-break: break-all; cursor: default; }
    .todos .text.editing { flex: 1; }
    .todos input.edit-input {
      flex: 1; font: inherit; font-size: 15px; padding: 4px 8px;
      border: 1px solid #42b883; border-radius: 6px; outline: none;
    }
    .todos .op { border: none; background: none; cursor: pointer; font-size: 13px; color: #5b8def; padding: 2px 4px; }
    .todos .op.del { color: #d05353; }
    .todos .op:hover { text-decoration: underline; }
    .empty { text-align: center; color: #b0b8c4; padding: 18px 0 26px; }
    .stat {
      display: flex; justify-content: space-between; padding: 12px 26px;
      background: #f7f9fc; color: #5b6675; font-size: 13px;
    }
    .stat b { color: #2c8c63; }
  </style>
</head>
<body>
<div id="app" class="todo-app">
  <h2>待办事项 TodoList</h2>
  <p class="sub">输入内容后按回车添加；点击文字切换完成状态；点击“编辑”修改，失焦或回车保存</p>

  <!-- 表单：v-model 双向绑定 + @submit.prevent 阻止默认提交 -->
  <form class="todo-form" @submit.prevent="add">
    <input type="text" v-model.trim="taskText" placeholder="请输入待办事项后回车">
    <button type="submit">添加</button>
  </form>

  <p class="empty" v-if="todos.length === 0">暂无待办事项，快添加一条吧～</p>

  <ul class="todos">
    <li
      v-for="(item, index) in todos"
      :key="item.id"
      :class="{ done: item.done }">
      <input type="checkbox" v-model="item.done" :title="item.done ? '标记为未完成' : '标记为已完成'">
      <template v-if="item.editing">
        <input
          class="edit-input"
          type="text"
          v-model="item.text"
          v-focus
          @blur="finishEdit(item)"
          @keyup.enter="finishEdit(item)"
          @keyup.esc="cancelEdit(item)">
      </template>
      <span v-else class="text" @dblclick="startEdit(item)">{{ item.text }}</span>
      <button type="button" class="op" v-if="!item.editing" @click="startEdit(item)">编辑</button>
      <button type="button" class="op del" @click="del(index)">删除</button>
    </li>
  </ul>

  <!-- v-if：有数据时才显示统计栏 -->
  <div class="stat" v-if="todos.length">
    <span>共 <b>{{ todos.length }}</b> 项，未完成 <b>{{ activeCount }}</b> 项，已完成 <b>{{ doneCount }}</b> 项</span>
    <span v-if="doneCount">完成率 {{ percent }}%</span>
    <span v-else>加油！</span>
  </div>
</div>

<script src="./js/vue.global.js"></script>
<script>
  const { createApp } = Vue;

  createApp({
    data() {
      return {
        todos: [
          { id: 1, text: '阅读 Vue.js 官方文档的模板语法', done: true, editing: false },
          { id: 2, text: '完成实验5：用 Vue 重构博客主页', done: false, editing: false },
          { id: 3, text: '完成实验6：组件与路由', done: false, editing: false }
        ],
        taskText: '',
        uid: 100
      };
    },
    computed: {
      doneCount() {
        return this.todos.filter(item => item.done).length;
      },
      activeCount() {
        return this.todos.length - this.doneCount;
      },
      percent() {
        if (!this.todos.length) return 0;
        return Math.round(this.doneCount / this.todos.length * 100);
      }
    },
    methods: {
      /* 添加：内容非空才加入数组，然后清空输入框 */
      add() {
        if (!this.taskText) return;
        this.todos.push({ id: ++this.uid, text: this.taskText, done: false, editing: false });
        this.taskText = '';
      },
      /* 删除：按索引删除 */
      del(index) {
        this.todos.splice(index, 1);
      },
      startEdit(item) {
        item.editing = true;
      },
      /* 编辑完成：内容为空则删除该项，否则恢复为 p/span 显示 */
      finishEdit(item) {
        item.editing = false;
        if (!item.text.trim()) {
          this.todos = this.todos.filter(t => t !== item);
        } else {
          item.text = item.text.trim();
        }
      },
      cancelEdit(item) {
        item.editing = false;
      }
    }
  })
    .directive('focus', {
      /* 自定义指令：编辑框出现后自动获得焦点 */
      mounted(el) { el.focus(); }
    })
    .mount('#app');
</script>
</body>
</html>
