<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>父子组件传值演示</title>
  <style>
    body { font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; padding: 24px; background: #f4f6fa; color: #2c3e50; }
    #app { max-width: 720px; margin: 0 auto; }
    h3 { margin: 0 0 12px; }
    .user-card { background: #fff; border-radius: 12px; padding: 16px 20px; box-shadow: 0 2px 10px rgba(31,45,61,.08); border-top: 4px solid #42b883; }
    .user-card h4 { margin: 0 0 8px; color: #2c8c63; }
    .user-card p { margin: 4px 0; }
    .user-card button { margin-top: 8px; padding: 6px 16px; border: none; border-radius: 8px; background: #42b883; color: #fff; cursor: pointer; }
    .user-card .warn { color: #d05353; font-size: 13px; }
    .message { margin-top: 14px; padding: 12px 16px; border-radius: 10px; background: #e6f7ef; color: #2c8c63; }
  </style>
</head>
<body>
<div id="app">
  <h3>父组件：传递静态数据给子组件</h3>
  <!-- 监听子组件的 greet 事件 -->
  <user-card name="james" age="19" :gender="1" @greet="showGreeting"></user-card>

  <!-- 展示子组件传递过来的信息 -->
  <div class="message" v-if="greeting">
    子组件传来的消息：{{ greeting }}
  </div>
</div>

<script src="../../shots/vendor/vue.global.js"></script>
<script>
  const { createApp } = Vue;

  const UserCard = {
    /* 从父组件接受的数据：对象形式进行类型校验 */
    props: {
      name: String,
      age: String,
      gender: {
        type: Number,
        default: 0,
        validator: value => [0, 1].includes(value)
      }
    },
    /* 数组形式声明要触发的事件 */
    emits: ['greet'],
    template: `
      <div class="user-card">
        <h4>子组件：用户信息</h4>
        <p>姓名：{{ name }}</p>
        <p>年龄：{{ age }}</p>
        <p>性别：{{ gender === 1 ? '男' : '女' }}</p>
        <p class="warn" v-if="gender === 0">未传入合法的性别值</p>
        <button type="button" @click="sendGreeting">向父组件打招呼</button>
      </div>
    `,
    methods: {
      sendGreeting() {
        try {
          /* 单向数据流：子组件不能直接修改 props，只能触发事件通知父组件 */
          this.name = 'tom';
        } catch (e) {
          console.warn('修改 props 失败：', e.message);
        }
        const message = `大家好，我是${this.name}，今年${this.age}岁`;
        this.$emit('greet', message); // 触发自定义事件，并传递数据
      }
    }
  };

  const App = {
    components: { UserCard },
    data() {
      return {
        greeting: '' // 用于存储子组件传递过来的信息
      };
    },
    methods: {
      showGreeting(message) {
        this.greeting = message;
      }
    }
  };

  createApp(App).mount('#app');
</script>
</body>
</html>
