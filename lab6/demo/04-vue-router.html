<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue Router 基础示例</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; background: #f4f6fa; color: #2c3e50; }
    #app { max-width: 760px; margin: 32px auto; background: #fff; border-radius: 14px; box-shadow: 0 8px 28px rgba(31,45,61,.1); overflow: hidden; }
    h1 { margin: 0; padding: 20px 28px 6px; font-size: 22px; }
    nav { display: flex; gap: 6px; padding: 0 28px; border-bottom: 1px solid #eef0f4; }
    nav a { padding: 10px 14px; color: #5b6675; text-decoration: none; border-bottom: 3px solid transparent; font-size: 15px; letter-spacing: 1px; }
    nav a:hover { color: #2c8c63; }
    nav a.router-link-active { color: #2c8c63; border-bottom-color: #42b883; font-weight: 600; }
    .view { padding: 22px 28px 30px; min-height: 150px; line-height: 1.8; }
    .path { font-family: Consolas, Menlo, monospace; background: #f1f3f7; padding: 1px 6px; border-radius: 4px; font-size: 13px; }
  </style>
</head>
<body>
  <div id="app">
    <h1>我的博客</h1>
    <nav>
      <router-link to="/">HOME</router-link>
      <router-link to="/about">ABOUT</router-link>
      <router-link to="/article/1">文章 1</router-link>
      <router-link to="/article/2">文章 2</router-link>
    </nav>
    <!-- 当前地址匹配的组件渲染在这里 -->
    <div class="view">
      <router-view></router-view>
    </div>
  </div>

  <script src="../js/vue.global.js"></script>
  <!-- 通过 CDN 引入 Vue Router 4，使网页能够使用 Vue Router 提供的路由功能 -->
  <script src="../js/vue-router.global.js"></script>
  <script>
    // 自定义组件模板
    const Home = {
      template: `<div>
        <p>首页：欢迎阅读我的博客</p>
        <p style="color:#8a94a6;font-size:14px">我是 2026 级软件工程专业的学生，这里记录我的学习笔记。</p>
      </div>`
    };
    const About = {
      template: `<div>
        <p>关于：这里记录我的学习笔记</p>
        <p style="color:#8a94a6;font-size:14px">使用 Vue 3 + Vue Router 4 构建的单页应用。</p>
      </div>`
    };
    // 动态路由：/article/:id，通过 $route.params 读取参数
    const Article = {
      template: `<div>
        <p>文章详情：当前文章 id = <b>{{ $route.params.id }}</b></p>
        <p style="color:#8a94a6;font-size:14px">完整路径：<span class="path">{{ $route.fullPath }}</span></p>
      </div>`
    };
    const NotFound = {
      template: `<p>404：页面走丢了，<router-link to="/">返回首页</router-link></p>`
    };

    const router = VueRouter.createRouter({
      // 设置路由的工作模式为 Hash 模式
      history: VueRouter.createWebHashHistory(),
      // 配置 URL 地址与 Vue 组件之间的对应关系
      routes: [
        { path: '/', component: Home, name: 'home' },
        { path: '/about', component: About, name: 'about' },
        { path: '/article/:id', component: Article, name: 'article' },
        { path: '/:pathMatch(.*)*', component: NotFound }
      ]
    });

    // Vue 链式调用：createApp() 创建应用，use() 安装路由插件，mount() 启动页面渲染
    Vue.createApp({}).use(router).mount('#app');
  </script>
</body>
</html>
